name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q .

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task:
          - Task_1_Sentiment_Analysis
          - Task_2_News_Classification
          - Task_3_Fake_News
          - Task_4_NER
          - Task_5_Topic_Modeling
          - Task_7_Text_Summarization
    defaults:
      run:
        working-directory: ${{ matrix.task }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Download spaCy model
        if: matrix.task == 'Task_4_NER'
        run: python -m spacy download en_core_web_sm
      - name: Run tests
        run: python -m pytest tests -q
